# 4단계 순찰 경로 (patrol_node). 좌표는 map 프레임 [m] (시뮬레이션에서는 Gazebo 월드 좌표와 같음).
# 순서대로 돌고, 마지막 지점 다음에는 처음 지점으로 돌아가 반복한다.
# yaw 를 생략하면 '다음 지점을 바라보는 방향'으로 자동 계산한다 → 도착 후 제자리 회전이 줄어든다.
# 모든 지점은 지도상 장애물과 0.35 m 이상 떨어져 있다 (지점을 바꾸면 이 거리도 확인할 것).
patrol:
  dwell_time: 2.0          # 각 지점에서 멈춰 있는 시간 [초]. 라이다가 360° 라서 회전 없이 정지만 한다
  checkpoints:
    - {name: 출발점,         x: -3.00, y:  0.00}
    - {name: 캐비닛 서쪽,    x: -3.45, y: -1.65}   # 2단계 지도 사각지대: 캐비닛-서쪽 벽 틈
    - {name: 캐비닛 동쪽,    x: -1.60, y: -2.40}   # 2단계 지도 사각지대: 캐비닛-남쪽 벽 틈을 옆에서 봄
    - {name: 남쪽 가운데,    x:  0.00, y: -2.30}
    - {name: 남동 구역,      x:  1.70, y: -2.40}   # 칸막이 안쪽
    - {name: 남동 상자 동쪽, x:  3.40, y: -1.00}
    - {name: 북동쪽,         x:  3.40, y:  1.00}
    - {name: 북쪽 가운데,    x:  0.00, y:  2.40}
    - {name: 북서쪽,         x: -3.20, y:  2.20}
