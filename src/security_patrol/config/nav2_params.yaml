# Nav2 (Humble) 설정 - ESP32 4륜 스키드 스티어 순찰 로봇용
# nav2_bringup 기본 nav2_params.yaml 에서 이 로봇에 맞게 바꾼 값에 주석을 달았다.
#   - 로봇: 약 0.23 x 0.19 m, 최고 속도 낮음, 제자리 회전 가능(명령 대비 약 80%)
#   - 라이다: 360°, 0.15~8 m, 5~6 Hz
#   - 프레임: map → odom → base_link (base_footprint 아님)
#   - UTM 가상머신(CPU 렌더링)에서 CPU 가 부족해 AMCL 이 위치를 잃은 적이 있어 계산 주기를 낮췄다 (기본값은 주석에)

amcl:
  ros__parameters:
    use_sim_time: True
    # odom 오차 예상치 (기본 0.2). 시뮬레이션 odom 은 정확한 편이라 조금 낮춤 (alpha5 = 옆 미끄러짐)
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: "base_link"          # 기본 base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0                # 라이다 최대 거리 (기본 100.0)
    laser_min_range: 0.15               # 라이다 최소 거리 (기본 -1.0)
    laser_model_type: "likelihood_field"
    max_beams: 90                       # 720점 중 사용할 빔 수 (기본 60)
    max_particles: 1000                 # CPU 절약 (기본 2000)
    min_particles: 300                  # (기본 500)
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # 시뮬레이션 전용: odom 이 Gazebo 실제 위치라서 스키드 스티어가 회전할 때 생기는 흔들림(1~2 cm)까지 들어온다.
    # DifferentialMotionModel 은 이 흔들림을 '이동 방향'으로 해석해 오차를 과하게 잡으므로 Omni 모델을 쓴다.
    # 실제 로봇(엔코더 + 자이로 odom)은 8단계에서 별도 설정 파일로 DifferentialMotionModel 을 쓴다.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.15                  # 작은 로봇이라 조금만 움직여도 갱신 (기본 0.2)
    update_min_d: 0.1                   # (기본 0.25)
    z_hit: 0.9                          # 라이다를 더 믿음 → 흩어진 파티클을 빨리 다시 모음 (기본 0.5)
    z_max: 0.05
    z_rand: 0.1                         # (기본 0.5)
    z_short: 0.05
    scan_topic: scan
    # 시뮬레이션 시작 위치 (map 좌표 = Gazebo 월드 좌표). 실제 로봇은 RViz 2D Pose Estimate 로 지정
    set_initial_pose: true
    initial_pose:
      x: -3.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 20                # 판단 루프 50 Hz (기본 10 ms = 100 Hz)
    default_server_timeout: 20
    # plugin_lib_names 를 생략하면 Humble 기본 BT 노드 전체를 사용한다

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0          # CPU 절약 (기본 20.0), 최고 0.2 m/s 라 10 Hz 로 충분
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3     # 느린 로봇이라 기준을 낮춤 (기본 0.5)
      movement_time_allowance: 15.0     # 제자리 회전 시간을 고려해 여유 (기본 10.0)

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15           # (기본 0.25)
      yaw_goal_tolerance: 0.25

    # Regulated Pure Pursuit: 경로를 따라가다 방향 차이가 크면 제자리 회전 → 스키드 스티어에 단순하고 안정적
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0             # (기본 5.0)
      publish_frequency: 1.0            # (기본 2.0)
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 바퀴 바깥쪽까지 포함한 로봇 외곽 (x ±0.115, y ±0.09) + 약간 여유
      footprint: "[[0.13, 0.10], [0.13, -0.10], [-0.13, -0.10], [-0.13, 0.10]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.30          # 작은 로봇 + 좁은 통로 (기본 0.55)
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.13, 0.10], [0.13, -0.10], [-0.13, -0.10], [-0.13, 0.10]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""   # bringup_launch.py 의 map 인자로 지정

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 5.0     # 경고 기준만 바꿈 (기본 20.0)
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 10.0           # 컨트롤러 주기에 맞춤 (기본 20.0)
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 1.0]       # 기본 [0.26, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
