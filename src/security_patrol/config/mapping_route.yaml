# 시뮬레이션 restricted_area 월드 전용 지도 작성 경로 (auto_mapper 노드)
# 좌표는 odom 프레임 [m]. 시뮬레이션에서는 odom = Gazebo 월드 좌표 (로봇 시작점 -3, 0).
# 장애물과 최소 0.35 m 이상 떨어지도록 잡았다. 실제 공간에서는 이 경로 대신 자율 탐사(3.5단계)를 쓴다.
auto_mapper:
  ros__parameters:
    # [x1, y1, x2, y2, ...] 순서대로 방문
    waypoints: [
      -3.2,  1.6,   # 북서쪽
      -1.6,  2.3,   # 짧은 벽(x=-1) 서쪽
      -1.5,  1.2,
       0.0,  1.2,   # 짧은 벽 아래로 동쪽 이동
       0.0,  2.4,   # 북쪽 가운데
       2.0,  2.5,
       3.5,  2.55,  # 북동쪽 상자 위로
       3.5,  0.9,   # 동쪽 벽 따라 내려감
       2.0,  0.9,
       1.6, -0.8,   # 칸막이 안쪽(남동 구역) 진입
       1.6, -2.4,
       3.4, -2.4,   # 남동쪽 상자 아래
       3.4, -0.4,
       2.0,  0.9,   # 남동 구역 빠져나옴
       0.0,  0.9,
       0.0, -2.3,   # 남쪽 가운데
      -1.5, -2.3,   # 캐비닛 동쪽
      -1.5, -1.2,
      -3.4, -1.2,   # 서쪽
      -3.0,  0.0,   # 출발점 복귀 (루프 클로저)
    ]
    linear_speed: 0.15      # m/s, SLAM 품질을 위해 천천히
    angular_speed: 0.8      # rad/s
    goal_tolerance: 0.15    # m
