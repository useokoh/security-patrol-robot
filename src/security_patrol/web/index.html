<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>SENTINEL 관제</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- 상단: 연결 · 배터리 · Wi-Fi · 위치추정 -->
  <header class="top">
    <div class="brand">SENTINEL</div>
    <div class="chips">
      <span class="chip" id="conn"><i class="dot"></i><b>연결 중</b></span>
      <span class="chip" id="battery">배터리 <b>-</b></span>
      <span class="chip" id="wifi">Wi-Fi <b>-</b></span>
      <span class="chip" id="loc">위치 <b>-</b></span>
    </div>
  </header>

  <!-- 가운데: 레이더 / 지도 화면 -->
  <main class="view">
    <canvas id="canvas"></canvas>
    <div class="view-tools">
      <div class="seg" id="viewMode">
        <button data-mode="radar" class="on">레이더</button>
        <button data-mode="map">지도</button>
      </div>
      <div class="zoom">
        <button id="zoomOut" aria-label="축소">−</button>
        <span id="zoomLabel">4 m</span>
        <button id="zoomIn" aria-label="확대">+</button>
      </div>
    </div>
    <div class="legend">
      <span><i class="lg scan"></i>라이다</span>
      <span><i class="lg robot"></i>로봇</span>
      <span><i class="lg caution"></i>주의</span>
      <span><i class="lg urgent"></i>긴급</span>
    </div>
    <div class="banner" id="banner" hidden></div>
  </main>

  <!-- 아래: 순찰 상태 + 수동/자동 -->
  <section class="panel">
    <div class="patrol" id="patrol">순찰 정보 없음</div>
    <div class="tabs" id="tabs">
      <button data-tab="manual" class="on">수동 주행</button>
      <button data-tab="auto">자동 주행</button>
      <button data-tab="map">지도</button>
    </div>
    <div class="tab-body" data-body="manual">
      <div class="drive">
        <!-- 조이스틱: 위 = 앞으로, 좌우 = 제자리 회전. 손을 떼면 바로 정지 -->
        <div class="stick" id="stick" role="application" aria-label="조이스틱">
          <div class="knob" id="knob"></div>
        </div>
        <div class="drive-side">
          <div class="drive-status" id="driveStatus">조이스틱으로 조종하세요</div>
          <div class="drive-speed" id="driveSpeed">-</div>
          <button class="ghost" id="stopPatrolForManual" hidden>순찰 멈추고 수동 주행</button>
          <label class="speed">
            <span class="speed-head">속도 <b id="speedLabel">50%</b></span>
            <input type="range" id="speedRange" min="10" max="100" step="10" value="50" aria-label="최고 속도">
          </label>
          <button class="estop" id="estop">정지</button>
        </div>
      </div>
      <p class="hint">컴퓨터: 방향키 또는 W·A·S·D 를 누르고 있는 동안 움직임 · [ ] = 속도 · 스페이스 = 정지</p>
    </div>
    <div class="tab-body" data-body="map" hidden>
      <!-- 지도 만들기 (자율 탐사): 로봇이 스스로 돌며 지도를 채우고, 끝나면 지도와 순찰 코스를 저장한다 -->
      <div class="mode-line" id="modeLine">모드 정보 없음</div>
      <div class="explore-stats" id="exploreStats" hidden></div>
      <p class="soon" id="mapHint">로봇이 스스로 돌아다니며 새 지도를 만들고, 끝나면 출발점으로 돌아와 순찰 코스까지 만듭니다.
        그동안 순찰과 이상 감지는 멈춥니다. 로봇 주변을 비워 두세요.</p>
      <div class="map-actions" id="mapActions"></div>
    </div>
    <div class="tab-body" data-body="auto" hidden>
      <div class="auto-head"><span>순찰 코스</span>
        <span><button class="link" id="planOpen">＋ 자동 만들기</button><button class="link" id="refreshCourses">새로 고침</button></span>
      </div>
      <!-- 지도로 코스 자동 만들기: 감시 거리를 고르면 지도에 미리보기, 저장하면 목록에 들어간다 -->
      <div class="plan" id="planBox" hidden>
        <div class="plan-title">지도로 코스 자동 만들기</div>
        <div class="auto-row">
          <span class="auto-label">감시 거리</span>
          <div class="seg small" id="viewChoice">
            <button data-view="1.5">촘촘 1.5m</button>
            <button data-view="2.5" class="on">보통 2.5m</button>
            <button data-view="3.5">넓게 3.5m</button>
          </div>
        </div>
        <div class="plan-info" id="planInfo">계산 중…</div>
        <input class="plan-name" id="planName" maxlength="30" placeholder="코스 이름 (비우면 날짜로)">
        <div class="plan-actions">
          <button class="btn2" id="planCancel">취소</button>
          <button class="btn2 primary" id="planSave" disabled>이 코스 저장</button>
        </div>
      </div>
      <div id="autoMain">
      <div class="courses" id="courses"><p class="soon">코스를 불러오는 중…</p></div>
      <div class="auto-row">
        <span class="auto-label">바퀴</span>
        <div class="seg small" id="lapChoice">
          <button data-laps="0" class="on">계속 반복</button>
          <button data-laps="1">1바퀴</button>
          <button data-laps="3">3바퀴</button>
        </div>
      </div>
      <div class="progress" id="progress" hidden>
        <div class="progress-text" id="progressText"></div>
        <div class="bar"><i id="progressBar"></i></div>
      </div>
      <button class="go" id="patrolBtn">순찰 시작</button>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
